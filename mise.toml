[env]
_.path = "target/debug"

[tasks.test]
depends = ["build:ui"]
run = [
  "cargo nextest run",
  "git submodule update --init --recursive",
  "test/bats/bin/bats test",
]

[tasks.build-dev]
description = "rebuild and restart supervisor (without sudo, as what Agent prefers), to make changes take effect"
depends = ["build"]
run = "pitchfork sup start -f"

[tasks.ci]
depends = ["lint", "build", "build:docs", "test", "test:web-ui"]

[tasks.ci-dev]
depends = ["lint-fix", "build", "build:docs", "test", "test:web-ui"]

[tasks.docs]
dir = "docs"
run = "pnpm install && exec pnpm run docs:dev"

[tasks.lint]
depends = ["build:ui"]
run = "hk check --all"

[tasks.lint-fix]
depends = ["build:ui"]
run = "hk fix --all"

[tasks.build]
depends = ["build:ui"]
run = ["cargo build"]

[tasks."test:web-ui"]
depends = ["build"]
dir = "ui"
run = [
  "pnpm install --frozen-lockfile",
  "if [ \"$(uname -s)\" = \"Linux\" ]; then pnpm exec playwright install --with-deps chromium; else pnpm exec playwright install chromium; fi",
  "pnpm exec playwright test",
]

[tasks."build:ui"]
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm run build && touch ../src/web/static_files.rs"
sources = ["src/**/*"]
outputs = ["dist/**/*"]

[tasks."build:docs"]
dir = "docs"
run = "pnpm install --frozen-lockfile && exec pnpm run docs:build"

[tasks.render]
depends = ["build"]
run = [
  "pitchfork usage > pitchfork.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  "usage g markdown -mf pitchfork.usage.kdl --out-dir docs/cli --url-prefix /cli",
  "usage g json -f pitchfork.usage.kdl > docs/cli/commands.json",
  "pitchfork schema > docs/public/schema.json",
  "pitchfork api-schema > docs/public/api-schema.json",
  "git add pitchfork.usage.kdl docs",
]

[tasks.install-dev]
depends = ["build:ui"]
env = { "PITCHFORK_LOG" = "debug" }
run = [
  "cargo install --path . --debug",
  "pitchfork sup start -f",
]

[tools]
aube = "latest"
bun = "latest" # for tests. FIXME: replace with aube + node
cargo-binstall = "latest"
communique = "latest"
hk = "latest"
node = "24.14.0"
pnpm = "11.10.0"
pkl = "latest"
usage = "latest" # for rendering CLI usage
"cargo:cargo-nextest" = "latest"
rust = "1.96.0"
zig = "0.15.2"
"github:rust-cross/cargo-zigbuild" = "0.23.4"
