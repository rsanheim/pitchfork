labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

variables:
  cache: &cache
    CARGO_HOME: /cache/pitchfork/cargo
    RUSTUP_HOME: /cache/pitchfork/rustup
    CARGO_TARGET_DIR: /cache/pitchfork/target
    CARGO_BUILD_JOBS: '4'
    MISE_DATA_DIR: /cache/pitchfork/mise
    MISE_CACHE_DIR: /cache/pitchfork/mise-cache
    XDG_CACHE_HOME: /cache/pitchfork/xdg
    PLAYWRIGHT_BROWSERS_PATH: /cache/pitchfork/playwright
    PNPM_CONFIG_STORE_DIR: /cache/pitchfork/pnpm
    PITCHFORK_RELEASE_DIR: /cache/pitchfork/releases

steps:
  - name: checks-and-build
    image: docker.io/library/rust:1.96.0-bookworm
    environment: *cache
    commands:
      - script/ci

  # Explicit opt-in. The first release can instead be uploaded with local gh.
  - name: upload-release
    image: docker.io/library/debian:bookworm-slim
    when:
      - event: manual
        evaluate: 'CI_COMMIT_TAG != "" && "${PITCHFORK_PUBLISH}" == "true"'
    environment:
      PITCHFORK_RELEASE_DIR: /cache/pitchfork/releases
      GH_TOKEN:
        from_secret: pitchfork_release_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates git gh perl
      - script/release upload "$CI_COMMIT_TAG" linux
